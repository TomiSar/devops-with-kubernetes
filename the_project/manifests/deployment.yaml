apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app-dep
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: project-storage
          persistentVolumeClaim:
            claimName: project-pvc
      containers:
        - name: todo-app
          image: 0455/todo-app:2.6
          env:
            - name: PORT
              valueFrom:
                configMapKeyRef:
                  name: todo-project-config
                  key: FRONTEND_PORT
            - name: IMAGE_URL
              valueFrom:
                configMapKeyRef:
                  name: todo-project-config
                  key: IMAGE_URL
            - name: IMAGE_DIR
              valueFrom:
                configMapKeyRef:
                  name: todo-project-config
                  key: IMAGE_DIR
            - name: IMAGE_FILE
              valueFrom:
                configMapKeyRef:
                  name: todo-project-config
                  key: IMAGE_FILE
            - name: CACHE_DURATION_MINUTES
              valueFrom:
                configMapKeyRef:
                  name: todo-project-config
                  key: CACHE_DURATION_MINUTES
            - name: TODOS_API_PATH
              valueFrom:
                configMapKeyRef:
                  name: todo-project-config
                  key: TODOS_API_PATH
          volumeMounts:
            - name: project-storage
              mountPath: /usr/src/app/files
