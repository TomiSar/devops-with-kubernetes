apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-app-dep
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-app
  template:
    metadata:
      labels:
        app: todo-app
    spec:
      volumes:
        - name: project-storage
          persistentVolumeClaim:
            claimName: project-pvc
      containers:
        - name: todo-app
          image: 0455/todo-app:1.13
          env:
            - name: PORT
              value: '3000'
          volumeMounts:
            - name: project-storage
              mountPath: /usr/src/app/files
